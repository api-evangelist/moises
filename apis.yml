aid: moises
name: Moises
description: >-
  Moises is the creative suite for musicians from Music AI, Inc., serving more than
  70 million musicians worldwide with AI-powered tools for practice, performance, and
  creation — stem separation to isolate vocals and instruments, chord and key detection,
  AI-generated stems, and voice synthesis across web, desktop, iOS, and Android. The
  same models power the Music AI developer platform (music.ai, formerly reached at
  developer.moises.ai), a B2B REST API that exposes those capabilities as composable
  Modules assembled into Workflows and executed as asynchronous Jobs. Developers upload
  audio to temporary storage, submit a job against a workflow, and poll for results,
  with official Node.js and Python SDKs and a command-line client. Moises won iPad App
  of the Year (2024) and was an Apple Design Awards finalist (2025), and is backed by
  Norwest Venture Partners.
